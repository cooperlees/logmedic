{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logmedic.secretName" . }}
  labels:
    {{- include "logmedic.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
{{- end }}
