{{- if .Values.activePassive.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "logmedic.fullname" . }}
  labels:
    {{- include "logmedic.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "logmedic.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "logmedic.fullname" . }}
{{- end }}
