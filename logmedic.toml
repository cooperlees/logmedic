# logmedic configuration

[daemon]
poll_interval_secs = 300   # 5 minutes
frequency_threshold = 50   # min occurrences to flag
lookback = "1h"
metrics_port = 6969        # HTTP server: /metrics + /healthz

# --- Detector plugins ---

[plugins.loki]
kind = "python"
path = "plugins/loki_detector/plugin.py"
loki_url = "http://localhost:3100"
# org_id = "tenant-1"
# extra_labels = '{namespace="production"}'
# query = '{app="myservice"} |= "error"'
# limit = 10000  # max log lines to fetch per query
# deny_labels = ["app=homeassistant", "namespace=legacy"]  # skip anomalies from these Loki stream labels
# deny_labels = ["container_name=home-assistant", ["hostname=home2.cooperlees.com", "unit=systemd-networkd.service"]]
# deny_label_sets = [["hostname=home2.cooperlees.com", "unit=systemd-networkd.service"]]  # optional explicit AND rules

# --- Remediator plugins ---

[remediators.claude]
kind = "ai"
path = "plugins/claude_remediator/plugin.py"
# anthropic_api_key = ""  # or set ANTHROPIC_API_KEY env var
model = "claude-opus-4-6"
# default_repo = "myorg/infra-ansible"
# auto_execute = false  # false (default): mutating actions stay "proposed", nothing runs
# enable_ssh = false
# ssh_key_path = "~/.ssh/id_ed25519"
# system_prompt = "Our infra uses Ansible for config management. Services run on k8s in AWS."

# --- Meta Muse Spark remediator (alternative to Claude) ---
# Uses https://api.meta.ai/v1 with META_API_KEY. "latest-contributor"
# auto-selects the newest *-contributor model (e.g. muse-spark-1.3-contributor
# today). local_repo_path reads repo context from a local checkout instead
# of the GitHub API (no github_token needed for context).

